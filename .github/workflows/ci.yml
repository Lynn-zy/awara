# 日常持续集成流水线：在推送 main 分支或提交 Pull Request 时自动执行编译、单元测试与 Lint 质量检查
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支有新提交时自动取消进行中的旧任务，节约构建资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 编译、单测与 Lint 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 执行单元测试、仪器测试编译与 Release Lint 校验
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintVitalRelease --no-daemon
