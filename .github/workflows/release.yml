# 正式版本自动签名与发布流水线：推送 v* 标签（如 v1.3.0）时自动构建正式签名 APK 并发布至 GitHub Releases
name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的版本标签（例如 v1.3.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 正式签名打包并发布 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整源码与标签历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 解析目标版本标签
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION_CLEAN="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"

      - name: 配置 JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 解码并校验正式签名证书配置
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::缺少正式签名所需的 GitHub Secrets（SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD），已中止发版以防误用 Debug 证书。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "${RUNNER_TEMP}/awara-release.jks"

      - name: 执行发版前单测与 Release Lint 门禁
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintVitalRelease --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}"

      - name: 构建正式签名通用 Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/awara-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}"

      - name: 核验 APK 正式证书签名、版本号并生成 SHA-256 校验文件
        run: |
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$RAW_APK" ]]; then
            echo "::error::未找到构建产物 $RAW_APK"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "${SDK_DIR}/build-tools/"* | sort -V | tail -n 1)
          CERT_INFO=$("${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$RAW_APK")
          echo "$CERT_INFO"

          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::检测到 APK 使用了 Android Debug 调试证书，正式发布必须使用正式证书签名！"
            exit 1
          fi

          BADGING=$("${BUILD_TOOLS_DIR}/aapt2" dump badging "$RAW_APK" | head -n 5)
          echo "$BADGING"
          EXPECTED_VERSION="${{ steps.meta.outputs.version }}"
          if ! echo "$BADGING" | grep -Fq "versionName='${EXPECTED_VERSION}'"; then
            echo "::error::标签版本 (${EXPECTED_VERSION}) 与 APK 内置 versionName 不一致，请先同步更新 app/build.gradle.kts！"
            exit 1
          fi

          mkdir -p dist
          TARGET_APK="dist/Awara-${EXPECTED_VERSION}-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          (cd dist && sha256sum "$(basename "$TARGET_APK")" > "$(basename "$TARGET_APK").sha256")
          cat "${TARGET_APK}.sha256"

      - name: 生成 Release 更新说明（CHANGELOG.md 优先，Git Commits 兜底）
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess

          version = os.environ["EXPECTED_VERSION"].strip()
          tag_name = os.environ["TAG_NAME"].strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "Lynn-zy/awara").strip()
          changelog_path = "CHANGELOG.md"
          output_path = "dist/release-notes.md"


          def run_git(args):
              res = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              return res.returncode, res.stdout.strip()


          def extract_from_changelog(path, ver):
              if not os.path.isfile(path):
                  return ""
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()

              heading_pattern = re.compile(rf"^##\s+\[?v?{re.escape(ver)}(?:\]|\s|$)")
              stop_pattern = re.compile(r"^(?:##\s+|\[[^\]]+\]:\s+https?://)")

              capturing = False
              section_lines = []
              for line in lines:
                  if not capturing:
                      if heading_pattern.match(line):
                          capturing = True
                      continue
                  if stop_pattern.match(line):
                      break
                  section_lines.append(line)

              return "\n".join(section_lines).strip()


          def resolve_target_ref(tag):
              code, _ = run_git(["rev-parse", "--verify", "--quiet", f"{tag}^{{commit}}"])
              return tag if code == 0 else "HEAD"


          def resolve_previous_tag(target_ref):
              code, prev = run_git(
                  ["describe", "--tags", "--abbrev=0", "--match", "v*", f"{target_ref}~1"]
              )
              return prev if code == 0 and prev else None


          def generate_from_git(target_ref, prev_tag):
              rev_range = f"{prev_tag}..{target_ref}" if prev_tag else target_ref
              log_args = ["log", "--no-merges", "--format=%h%x09%s", rev_range]
              if not prev_tag:
                  log_args.extend(["-n", "30"])
              code, out = run_git(log_args)
              if code != 0 or not out:
                  return ""

              feats = []
              fixes = []
              improves = []
              all_entries = []
              cc_pattern = re.compile(r"^([a-zA-Z]+)(?:\([^)]+\))?!?:\s*(.+)$")

              for line in out.splitlines():
                  if "\t" not in line:
                      continue
                  sha, subject = line.split("\t", 1)
                  subject = subject.strip()
                  if not subject:
                      continue
                  all_entries.append(f"- {subject} (`{sha}`)")
                  match = cc_pattern.match(subject)
                  if not match:
                      continue
                  commit_type = match.group(1).lower()
                  desc = match.group(2).strip()
                  bullet = f"- {desc} (`{sha}`)"
                  if commit_type == "feat":
                      feats.append(bullet)
                  elif commit_type == "fix":
                      fixes.append(bullet)
                  elif commit_type in ("perf", "refactor"):
                      improves.append(bullet)

              sections = []
              if feats:
                  sections.append("### ✨ 新增功能\n\n" + "\n".join(feats))
              if fixes:
                  sections.append("### 🐛 问题修复\n\n" + "\n".join(fixes))
              if improves:
                  sections.append("### ⚡ 优化与重构\n\n" + "\n".join(improves))
              if not sections and all_entries:
                  sections.append("### 📝 变更记录\n\n" + "\n".join(all_entries))

              return "\n\n".join(sections).strip()


          target_ref = resolve_target_ref(tag_name)
          prev_tag = resolve_previous_tag(target_ref)

          body = extract_from_changelog(changelog_path, version)
          if body:
              print(f"已从 {changelog_path} 提取版本 {version} 的更新说明。")
          else:
              print(f"{changelog_path} 中未找到版本 {version} 章节，正在从 Git 提交记录自动生成更新说明...")
              body = generate_from_git(target_ref, prev_tag)

          if not body:
              body = f"发布版本 {tag_name}。"

          if prev_tag and "compare/" not in body and "**Full Changelog**" not in body:
              body = f"{body}\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag_name}"

          os.makedirs(os.path.dirname(output_path), exist_ok=True)
          with open(output_path, "w", encoding="utf-8", newline="\n") as f:
              f.write(body + "\n")
          EOF

      - name: 自动创建 GitHub Release 并上传安装包
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Awara ${{ steps.meta.outputs.tag_name }}
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/*.sha256

      - name: 销毁临时签名证书文件
        if: always()
        run: rm -f "${RUNNER_TEMP}/awara-release.jks"
